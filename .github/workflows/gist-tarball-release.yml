name: Gist Tarball Release

on:
  push:
    branches: [main]
    paths:
      - 'packages/*/package.json'
      - 'scripts/pack-gist-tarballs.mjs'
      - '.github/workflows/gist-tarball-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-tarballs:
    name: Release tarballs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and pack Gist tarballs
        run: npm run pack:gist
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Write checksums
        run: |
          cd dist-tarballs
          sha256sum *.tgz > SHA256SUMS.txt

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist-tarballs/*.tgz dist-tarballs/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" dist-tarballs/*.tgz dist-tarballs/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --notes "Gist-consumable docx-editor tarballs for $tag."
          fi
