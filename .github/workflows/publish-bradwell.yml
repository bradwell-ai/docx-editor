name: Publish (Bradwell fork)

# Publishes @bradwell-ai/docx-js-editor to GitHub Packages on tag push.
#
# Tag format:
#   bradwell-v<MAJOR>.<MINOR>.<PATCH>   (e.g. bradwell-v0.1.2)
#
# The tag is independent of upstream's release tags so we don't clash with
# changesets/action when we periodically merge upstream/main.
#
# Flow:
#   1. Bump packages/react/package.json `version` on a feature branch.
#   2. Merge to main.
#   3. `git tag bradwell-v0.1.2 && git push origin bradwell-v0.1.2`.
#   4. This workflow builds and publishes.

on:
  push:
    tags:
      - 'bradwell-v*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Setup Node.js (for npm publish)
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@bradwell-ai'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Build docx-js-editor
        run: |
          bun run --filter '@eigenpal/docx-core' build
          bun run --filter '@bradwell-ai/docx-js-editor' build

      - name: Publish
        working-directory: packages/react
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
